<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Kibana Bulk Note</title>
    <style>
        @font-face {
            font-family: 'Intel One Mono';
            src: url('intel-one-mono-woff2/IntelOneMono-Light.woff2') format('woff2');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Intel One Mono';
            src: url('intel-one-mono-woff2/IntelOneMono-LightItalic.woff2') format('woff2');
            font-weight: 300;
            font-style: italic;
            font-display: swap;
        }
        @font-face {
            font-family: 'Intel One Mono';
            src: url('intel-one-mono-woff2/IntelOneMono-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Intel One Mono';
            src: url('intel-one-mono-woff2/IntelOneMono-Italic.woff2') format('woff2');
            font-weight: 400;
            font-style: italic;
            font-display: swap;
        }
        @font-face {
            font-family: 'Intel One Mono';
            src: url('intel-one-mono-woff2/IntelOneMono-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Intel One Mono';
            src: url('intel-one-mono-woff2/IntelOneMono-MediumItalic.woff2') format('woff2');
            font-weight: 500;
            font-style: italic;
            font-display: swap;
        }
        @font-face {
            font-family: 'Intel One Mono';
            src: url('intel-one-mono-woff2/IntelOneMono-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Intel One Mono';
            src: url('intel-one-mono-woff2/IntelOneMono-BoldItalic.woff2') format('woff2');
            font-weight: 700;
            font-style: italic;
            font-display: swap;
        }

        :root {
            --bg-base: #121419;
            --bg-elevated: #1a1d24;
            --bg-hover: #242830;
            --bg-input: #0c0e12;

            --border-subtle: rgba(255, 255, 255, 0.05);
            --border-default: rgba(255, 255, 255, 0.09);
            --border-strong: rgba(255, 255, 255, 0.15);

            --text-primary: #eef1f6;
            --text-secondary: #8b93a3;
            --text-muted: #525a69;

            --accent-primary: #4a9eff;
            --accent-bg: rgba(74, 158, 255, 0.10);

            --color-success: #3ecf8e;
            --color-success-bg: rgba(62, 207, 142, 0.10);
            --color-danger: #ff5c5c;
            --color-danger-bg: rgba(255, 92, 92, 0.10);
            --color-warning: #f0b400;

            --font-sans: "Intel One Mono", ui-monospace, monospace;
            --font-mono: "Intel One Mono", ui-monospace, monospace;

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-full: 999px;

            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            overflow: hidden;
            height: auto;
            max-height: 600px;
            background: var(--bg-base);
        }

        body {
            width: 360px;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 13px;
            line-height: 1.55;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11", "ss01", "tnum";
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            opacity: 0;
            transition: opacity 0.22s ease-out;
        }

        .app {
            display: flex;
            flex-direction: column;
            padding: 16px;
            max-height: 600px;
            overflow: hidden;
            background: var(--bg-base);
            gap: 12px;
            user-select: none;
            -webkit-user-select: none;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 26px;
            flex-shrink: 0;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .switch.disabled {
            opacity: 0.4;
            pointer-events: none;
            cursor: not-allowed;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: var(--bg-input);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-full);
            transition: background 0.25s ease, border-color 0.25s ease;
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 20px;
            width: 20px;
            left: 2px;
            top: 50%;
            transform: translateY(-50%);
            background: #b8bec9;
            border-radius: 50%;
            transition: transform 0.25s var(--ease-out-expo), background 0.25s ease;
        }

        input:checked + .slider {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        input:checked + .slider::before {
            transform: translateY(-50%) translateX(18px);
            background: #ffffff;
        }

        .switch:hover:not(.disabled) .slider { border-color: var(--border-strong); }
        .switch input:focus-visible + .slider {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        .switch-sm input:checked + .slider {
            background: var(--color-success);
            border-color: var(--color-success);
        }

        .switch-sm input:focus-visible + .slider {
            outline-color: var(--color-success);
        }

        .switch-danger input:checked + .slider {
            background: var(--color-danger);
            border-color: var(--color-danger);
        }

        .switch-danger input:focus-visible + .slider {
            outline-color: var(--color-danger);
        }

        .settings-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 0;
            flex-shrink: 0;
            transition: border-color 0.2s ease;
            overflow: hidden;
        }

        .setting-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 14px;
            width: 100%;
            height: 60px;
            gap: 10px;
            overflow: hidden;
            box-sizing: border-box;
        }

        .setting-row > .feature-icon {
            justify-self: start;
        }

        .setting-row > .switch,
        .setting-row > .btn {
            justify-self: end;
        }

        .feature-icon {
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            background: var(--bg-hover);
            color: var(--text-muted);
            border: 1px solid var(--border-default);
            flex-shrink: 0;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
            box-sizing: border-box;
        }

        .feature-icon:active {
            transform: scale(0.92);
        }

        .feature-icon:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        .feature-icon.disabled {
            opacity: 0.4;
            pointer-events: none;
            cursor: not-allowed;
        }

        .feature-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            display: block;
        }

        .feature-icon.is-active.icon-blue {
            background: var(--accent-bg);
            color: var(--accent-primary);
            border-color: rgba(74, 158, 255, 0.25);
        }

        .feature-icon.icon-blue:not(.is-active):not(.disabled):hover {
            background: rgba(74, 158, 255, 0.06);
            color: rgba(74, 158, 255, 0.70);
            border-color: rgba(74, 158, 255, 0.16);
        }

        .feature-icon.is-active.icon-blue:hover {
            background: rgba(74, 158, 255, 0.18);
            border-color: rgba(74, 158, 255, 0.40);
        }

        .feature-icon.is-active.icon-red {
            background: var(--color-danger-bg);
            color: var(--color-danger);
            border-color: rgba(255, 92, 92, 0.25);
        }

        .feature-icon.icon-red:not(.is-active):not(.disabled):hover {
            background: rgba(255, 92, 92, 0.06);
            color: rgba(255, 92, 92, 0.70);
            border-color: rgba(255, 92, 92, 0.16);
        }

        .feature-icon.is-active.icon-red:hover {
            background: rgba(255, 92, 92, 0.18);
            border-color: rgba(255, 92, 92, 0.40);
        }

        .feature-icon.is-active.icon-yellow {
            background: rgba(240, 180, 0, 0.10);
            color: var(--color-warning);
            border-color: rgba(240, 180, 0, 0.25);
        }

        .feature-icon.icon-yellow:not(.is-active):not(.disabled):hover {
            background: rgba(240, 180, 0, 0.06);
            color: rgba(240, 180, 0, 0.70);
            border-color: rgba(240, 180, 0, 0.16);
        }

        .feature-icon.is-active.icon-yellow:hover {
            background: rgba(240, 180, 0, 0.18);
            border-color: rgba(240, 180, 0, 0.40);
        }

        .feature-icon.is-active.icon-green {
            background: var(--color-success-bg);
            color: var(--color-success);
            border-color: rgba(62, 207, 142, 0.25);
        }

        .feature-icon.icon-green:not(.is-active):not(.disabled):hover {
            background: rgba(62, 207, 142, 0.06);
            color: rgba(62, 207, 142, 0.70);
            border-color: rgba(62, 207, 142, 0.16);
        }

        .feature-icon.is-active.icon-green:hover {
            background: rgba(62, 207, 142, 0.18);
            border-color: rgba(62, 207, 142, 0.40);
        }

        .setting-label {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 12.5px;
            font-family: var(--font-sans);
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.55;
        }

        .logs-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 26px;
            height: 26px;
            padding: 0 6px;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 600;
            line-height: 1;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .logs-count.has-items {
            background: var(--color-success-bg);
            border-color: rgba(62, 207, 142, 0.25);
            color: var(--color-success);
        }

        .logs-card.open {
            border-color: var(--border-default);
        }

        .logs-body {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            overflow: hidden;
            pointer-events: none;
            transition: grid-template-rows 0.28s var(--ease-out-expo),
                        opacity 0.2s var(--ease-out-expo);
        }

        .logs-card.open .logs-body {
            grid-template-rows: 1fr;
            opacity: 1;
            pointer-events: auto;
        }

        .supports-interpolate-size .logs-body {
            display: block;
            grid-template-rows: none;
            interpolate-size: allow-keywords;
            height: 0;
            transition: height 0.28s var(--ease-out-expo),
                        opacity 0.2s var(--ease-out-expo);
        }

        .supports-interpolate-size .logs-card.open .logs-body {
            grid-template-rows: none;
            height: auto;
        }

        .logs-card.animating .logs-body {
            will-change: opacity;
        }

        .logs-body-clip {
            min-height: 0;
            overflow: hidden;
        }

        .logs-body-inner {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0 14px 14px;
        }

        .logs-container {
            flex: 1 1 auto;
            min-height: 0;
            max-height: 175px;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.65;
            scrollbar-width: thin;
            scrollbar-color: var(--border-strong) transparent;
            contain: layout paint;
            scrollbar-gutter: stable;
        }

        .logs-container.is-empty {
            overflow-y: hidden;
        }

        .logs-container::-webkit-scrollbar { width: 8px; }
        .logs-container::-webkit-scrollbar-track { background: transparent; }
        .logs-container::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
        .logs-container::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .log-entry {
            padding: 3px 0;
            color: var(--text-secondary);
            display: flex;
            align-items: flex-start;
            gap: 6px;
            font-variant-numeric: tabular-nums;
        }

        .log-entry .time {
            color: var(--text-muted);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .log-entry .log-msg {
            flex: 1;
            word-break: break-word;
        }

        .log-entry.lvl-error .log-msg { color: var(--color-danger); }
        .log-entry.lvl-warn .log-msg { color: var(--color-warning); }
        .log-entry.lvl-success .log-msg { color: var(--color-success); }

        .logs-empty {
            display: flex;
            justify-content: center;
            padding: 10px 0;
            opacity: 0.5;
            font-style: italic;
        }

        .logs-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            color: var(--text-secondary);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 12.5px;
            font-weight: 500;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .btn:disabled { opacity: 0.6; cursor: default; }
        .btn:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--border-strong); }
        .btn:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; }

        .btn-inline {
            width: 76px;
            height: 34px;
            padding: 0 10px;
            font-size: 12px;
            font-weight: 500;
            line-height: normal;
            border-style: dashed;
            border-radius: var(--radius-sm);
            overflow: visible;
        }

        .btn-inline > span {
            display: block;
            width: 100%;
            text-align: center;
            line-height: 1.8;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #copyAlertsJsonBtn:not(.btn-yellow):not(.btn-danger):not(.btn-success):hover:not(:disabled) {
            background: var(--bg-hover);
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        .btn-yellow {
            color: var(--color-warning);
            border-color: rgba(240, 180, 0, 0.35);
        }

        .btn-yellow:hover:not(:disabled) {
            background: rgba(240, 180, 0, 0.10);
            border-color: var(--color-warning);
            border-style: solid;
        }

        .btn-yellow:focus-visible {
            outline-color: var(--color-warning);
        }

        .btn-copy-logs:hover:not(:disabled) {
            background: var(--accent-bg);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            border-style: solid;
        }

        .btn-clear-logs:hover:not(:disabled) {
            background: var(--color-danger-bg);
            border-color: var(--color-danger);
            color: var(--color-danger);
            border-style: solid;
        }

        .btn.btn-success,
        .btn.btn-success:hover:not(:disabled),
        .btn.btn-success:disabled {
            background: var(--color-success-bg);
            border-color: var(--color-success);
            color: var(--color-success);
            opacity: 1;
        }

        .btn.btn-danger,
        .btn.btn-danger:hover:not(:disabled),
        .btn.btn-danger:disabled {
            background: var(--color-danger-bg);
            border-color: var(--color-danger);
            color: var(--color-danger);
            opacity: 1;
        }

        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid var(--border-subtle);
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            flex-shrink: 0;
            text-align: center;
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
            cursor: pointer;
        }

        .footer-link:hover {
            color: var(--text-primary);
            text-decoration: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .logs-body,
            .supports-interpolate-size .logs-body {
                transition: none;
            }
            body { transition: none; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="settings-card">
            <div class="setting-row">
                <div class="feature-icon icon-blue" id="brand-logo" role="button" tabindex="0" aria-label="Toggle Bulk Note">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M5 7a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm4-1a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm2 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/>
                        <path fill-rule="evenodd" d="M2 1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h2v4.414L8.414 11H14a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H2Zm3 12v-3H2V2h12v8H8l-3 3Z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <span class="setting-label">Bulk Note</span>
                <label class="switch" title="Toggle Extension">
                    <input type="checkbox" id="toggle-switch">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="settings-card">
            <div class="setting-row">
                <div class="feature-icon icon-red" id="delete-icon" role="button" tabindex="0" aria-label="Toggle Delete Duplicate Notes">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M7 6H6v6h1V6Zm2.997 0h-1v6h1V6Z"/>
                        <path fill-rule="evenodd" d="M5 2v1H2v1h1v10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4h1V3h-3V2a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1Zm5 0H6v1h4V2ZM4 14V4h8v10H4Z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <span class="setting-label">Delete Duplicate Notes</span>
                <label class="switch switch-sm switch-danger" id="delete-switch-label">
                    <input type="checkbox" id="toggle-delete">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="settings-card">
            <div class="setting-row">
                <div class="feature-icon icon-yellow" id="copy-json-icon" role="button" tabindex="0" aria-label="Copy selected alerts JSON">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M2 2.729V2a1 1 0 0 1 1-1h2v1H3v12h4v1H3a1 1 0 0 1-1-1V2.729zM14 5V2a1 1 0 0 0-1-1h-2v1h2v3h1zm-1 1h2v9H8V6h5V5H8a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2v1z"/>
                        <path d="M9 10h5V9H9v1zm0-2h5V7H9v1zm0 4h5v-1H9v1zm0 2h5v-1H9v1zm2-12V1a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v1h1V1h4v1h1zM5 3h6V2H5v1z"/>
                    </svg>
                </div>
                <span class="setting-label">Copy Alerts JSON</span>
                <button id="copyAlertsJsonBtn" class="btn btn-inline" type="button">
                    <span id="copyAlertsJsonText">Copy</span>
                </button>
            </div>
        </div>

        <div class="settings-card logs-card" id="logs-card">
            <div class="setting-row">
                <div class="feature-icon icon-green" id="logs-icon" role="button" tabindex="0" aria-label="Toggle Activity Logs">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="m7.492 13.59 2-11-.984-.18-2 11 .984.18ZM4.854 5.354 2.207 8l2.647 2.646-.708.707L.793 8l3.353-3.354.708.708ZM15.207 8l-3.354-3.354-.707.708L13.793 8l-2.647 2.646.707.707L15.207 8Z"/>
                    </svg>
                </div>
                <span class="setting-label">
                    Show Activity Logs
                    <span class="logs-count" id="logs-count">0</span>
                </span>
                <label class="switch switch-sm">
                    <input type="checkbox" id="toggle-logs">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="logs-body" id="logs-body">
                <div class="logs-body-clip">
                    <div class="logs-body-inner">
                        <div class="logs-container" id="logs"></div>
                        <div class="logs-actions">
                            <button id="copyLogsBtn" class="btn btn-inline btn-copy-logs" type="button">
                                <span id="copyLogsText">Copy</span>
                            </button>
                            <button id="clearLogsBtn" class="btn btn-inline btn-clear-logs" type="button">
                                <span id="clearLogsText">Clear</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <a href="#" class="footer-link">Kibana Note Extension v1.0.3</a>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
